name: Deploy to GitHub Pages

# Reusable deploy of a build artifact (from ci.yml) to the repository's GitHub Pages site.
# One-time setup: Settings > Pages > Source: GitHub Actions.
# The caller must grant `pages: write` and `id-token: write`.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Build artifact to publish, usually needs.ci.outputs.artifact-name.
        type: string
        required: true
      spa-fallback:
        description: Serve index.html for unknown paths (single-page apps with client-side routing).
        type: boolean
        default: false
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-24.04
    outputs:
      url:
        description: Address of the published site.
        value: ${{ jobs.deploy.outputs.url }}

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: deploy-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check there is a build to publish
        if: inputs.artifact-name == ''
        run: |
          echo "::error::artifact-name is empty: the CI job kept no build output. Set its build-output input."
          exit 1

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: site

      - name: Add the single-page app fallback
        if: inputs.spa-fallback
        run: |
          if [ -f site/404.html ]; then
            echo "The site has its own 404.html; leaving it in place."
          else
            cp site/index.html site/404.html
          fi

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check the live site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for _ in $(seq 1 10); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$status" = 200 ]; then
              echo "Live at $URL" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$URL answered $status instead of 200."
          exit 1
