# Shared pipeline from https://github.com/Abbbtle/ci-pipelines; its README lists every input.
# Checks only: build, test and security scans on every push and pull request.

name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch newly published vulnerabilities in code that has not changed.
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: Abbbtle/ci-pipelines/.github/workflows/ci.yml@v1
    with:
      working-directory: .

  security:
    name: Security
    uses: Abbbtle/ci-pipelines/.github/workflows/security.yml@v1
    permissions:
      contents: read
      security-events: write
      actions: read
